<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f0f0f0; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes orbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes fadeIn { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes fadeSlideUp { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes pulseGlow { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
    @keyframes progressFill { 0%{width:0%} 100%{width:100%} }
    @keyframes particleDrift { 0%{transform:translate(0,0) scale(1);opacity:0.6} 50%{opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
    @keyframes dotPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    @keyframes slideInRight { 0%{transform:translateX(100%);opacity:0} 100%{transform:translateX(0);opacity:1} }
    @keyframes slideInLeft { 0%{transform:translateX(-100%);opacity:0} 100%{transform:translateX(0);opacity:1} }
    a { color: #2979FF; } a:hover { color: #1565C0; }
  </style>
</helmet>

<div style="zoom:{{ deviceScale }};width:402px;height:874px;flex-shrink:0">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px">
  <!-- SPLASH SCREEN -->
  <div style="position:absolute;inset:0;z-index:{{ splashZ }};opacity:{{ splashOpacity }};transition:opacity 0.6s ease;pointer-events:{{ splashPointer }}">
    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%, #2979FF 0%, #1565C0 40%, #0D47A1 80%, #0A1628 100%);position:relative;overflow:hidden">
      <!-- Floating particles -->
      <div style="position:absolute;inset:0;pointer-events:none">
        <div style="position:absolute;width:4px;height:4px;border-radius:50%;background:#FFD54F;top:20%;left:25%;animation:particleDrift 3s ease-in-out infinite;--dx:30px;--dy:-40px"></div>
        <div style="position:absolute;width:3px;height:3px;border-radius:50%;background:#FFD54F;top:35%;left:70%;animation:particleDrift 4s ease-in-out 0.5s infinite;--dx:-20px;--dy:-50px"></div>
        <div style="position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,213,79,0.5);top:60%;left:30%;animation:particleDrift 3.5s ease-in-out 1s infinite;--dx:40px;--dy:-30px"></div>
        <div style="position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,213,79,0.7);top:50%;left:80%;animation:particleDrift 4.5s ease-in-out 1.5s infinite;--dx:-35px;--dy:-45px"></div>
        <div style="position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.3);top:75%;left:55%;animation:particleDrift 3s ease-in-out 2s infinite;--dx:25px;--dy:-35px"></div>
        <div style="position:absolute;width:2px;height:2px;border-radius:50%;background:#FFD54F;top:15%;left:50%;animation:particleDrift 5s ease-in-out 0.8s infinite;--dx:-15px;--dy:-25px"></div>
      </div>
      <!-- Glow behind logo -->
      <div style="position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,213,79,0.15) 0%,transparent 70%);animation:pulseGlow 3s ease-in-out infinite"></div>
      <!-- Orbit ring -->
      <div style="position:relative;width:120px;height:120px;margin-bottom:24px">
        <div style="position:absolute;inset:0;border:1px solid rgba(255,255,255,0.1);border-radius:50%;animation:orbit 8s linear infinite">
          <div style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#FFD54F;box-shadow:0 0 12px rgba(255,213,79,0.6)"></div>
        </div>
        <!-- Football icon -->
        <svg viewBox="0 0 64 64" style="position:absolute;inset:20px;animation:float 4s ease-in-out infinite">
          <circle cx="32" cy="32" r="28" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
          <path d="M32 4 L32 18 M32 46 L32 60 M4 32 L18 32 M46 32 L60 32" stroke="white" stroke-width="1" opacity="0.4"/>
          <path d="M32 20 L40 26 L38 36 L26 36 L24 26 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
          <circle cx="32" cy="32" r="4" fill="#FFD54F"/>
        </svg>
      </div>
      <!-- Wordmark -->
      <div style="font-family:'Poppins',sans-serif;font-size:32px;font-weight:800;color:white;letter-spacing:4px;text-transform:uppercase;animation:fadeIn 1s ease-out">MATOBEV</div>
      <!-- Gold underline -->
      <div style="width:48px;height:2px;background:linear-gradient(90deg,transparent,#FFD54F,transparent);margin-top:8px;animation:fadeIn 1.2s ease-out"></div>
      <!-- Loading bar -->
      <div style="position:absolute;bottom:80px;width:140px;height:2px;background:rgba(255,255,255,0.1);border-radius:1px;overflow:hidden">
        <div style="height:100%;background:linear-gradient(90deg,#FFD54F,#FFC107);border-radius:1px;animation:progressFill 3s ease-in-out forwards"></div>
      </div>
    </div>
  </div>

  <!-- ONBOARDING SCREENS -->
  <div style="position:absolute;inset:0;z-index:{{ onboardingZ }};opacity:{{ onboardingOpacity }};transition:opacity 0.5s ease;pointer-events:{{ onboardingPointer }}">
    <div style="width:100%;height:100%;display:flex;flex-direction:column;background:#ffffff;position:relative;overflow:hidden">
      <!-- Hero area (65%) -->
      <div style="flex:0 0 65%;position:relative;overflow:hidden">
        <!-- Screen 1 -->
        <div style="position:absolute;inset:0;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.5s ease;transform:translateX({{ slide1X }});opacity:{{ slide1Op }}">
          <div style="width:100%;height:100%;background:linear-gradient(135deg,#0D47A1 0%,#1565C0 30%,#2979FF 70%,#1565C0 100%);display:flex;align-items:center;justify-content:center;position:relative">
            <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,0.15) 100%)"></div>
            <!-- Player silhouette with ball -->
            <svg viewBox="0 0 200 240" style="width:180px;opacity:0.95">
              <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFD54F"/><stop offset="100%" stop-color="#FFC107"/></linearGradient></defs>
              <!-- ground glow -->
              <ellipse cx="100" cy="220" rx="60" ry="8" fill="rgba(255,213,79,0.15)"/>
              <!-- player body -->
              <circle cx="100" cy="55" r="18" fill="white" opacity="0.9"/>
              <rect x="88" y="73" width="24" height="50" rx="8" fill="white" opacity="0.85"/>
              <!-- left leg dribbling -->
              <path d="M95 123 L80 175 L75 190" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
              <!-- right leg back -->
              <path d="M105 123 L120 165 L130 180" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
              <!-- left arm -->
              <path d="M88 85 L65 110" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
              <!-- right arm -->
              <path d="M112 85 L135 100" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
              <!-- ball -->
              <circle cx="70" cy="195" r="12" fill="url(#g1)"/>
              <path d="M65 190 L75 195 M68 198 L72 188" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="none"/>
            </svg>
            <!-- Golden hour overlay -->
            <div style="position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to top,rgba(255,213,79,0.08),transparent)"></div>
          </div>
        </div>

        <!-- Screen 2 -->
        <div style="position:absolute;inset:0;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.5s ease;transform:translateX({{ slide2X }});opacity:{{ slide2Op }}">
          <div style="width:100%;height:100%;background:linear-gradient(135deg,#0A1628 0%,#1565C0 50%,#0D47A1 100%);display:flex;align-items:center;justify-content:center;position:relative">
            <!-- AI scan figure -->
            <svg viewBox="0 0 200 260" style="width:170px">
              <!-- Skeleton lines -->
              <circle cx="100" cy="45" r="16" fill="none" stroke="#2979FF" stroke-width="1.5"/>
              <line x1="100" y1="61" x2="100" y2="140" stroke="#2979FF" stroke-width="1.5"/>
              <line x1="100" y1="80" x2="60" y2="115" stroke="#2979FF" stroke-width="1.5"/>
              <line x1="100" y1="80" x2="140" y2="110" stroke="#2979FF" stroke-width="1.5"/>
              <line x1="100" y1="140" x2="70" y2="200" stroke="#2979FF" stroke-width="1.5"/>
              <line x1="100" y1="140" x2="130" y2="195" stroke="#2979FF" stroke-width="1.5"/>
              <!-- Joint dots -->
              <circle cx="100" cy="45" r="4" fill="#FFD54F"/>
              <circle cx="100" cy="80" r="3" fill="#FFD54F"/>
              <circle cx="60" cy="115" r="3" fill="#FFD54F"/>
              <circle cx="140" cy="110" r="3" fill="#FFD54F"/>
              <circle cx="100" cy="140" r="3" fill="#FFD54F"/>
              <circle cx="70" cy="200" r="3" fill="#FFD54F"/>
              <circle cx="130" cy="195" r="3" fill="#FFD54F"/>
              <!-- Scan lines -->
              <line x1="30" y1="70" x2="170" y2="70" stroke="rgba(41,121,255,0.3)" stroke-width="0.5" stroke-dasharray="4,4"/>
              <line x1="30" y1="130" x2="170" y2="130" stroke="rgba(41,121,255,0.3)" stroke-width="0.5" stroke-dasharray="4,4"/>
              <line x1="30" y1="190" x2="170" y2="190" stroke="rgba(41,121,255,0.3)" stroke-width="0.5" stroke-dasharray="4,4"/>
            </svg>
            <!-- Floating stat chips -->
            <div style="position:absolute;top:25%;right:15%;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:6px 14px;animation:float 3s ease-in-out infinite">
              <div style="font-size:10px;color:rgba(255,255,255,0.6);font-weight:500">PACE</div>
              <div style="font-size:20px;color:#FFD54F;font-weight:700;letter-spacing:-1px">92</div>
            </div>
            <div style="position:absolute;top:45%;left:10%;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:6px 14px;animation:float 3.5s ease-in-out 0.5s infinite">
              <div style="font-size:10px;color:rgba(255,255,255,0.6);font-weight:500">SHOOTING</div>
              <div style="font-size:20px;color:#FFD54F;font-weight:700;letter-spacing:-1px">87</div>
            </div>
            <div style="position:absolute;bottom:25%;right:20%;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:6px 14px;animation:float 4s ease-in-out 1s infinite">
              <div style="font-size:10px;color:rgba(255,255,255,0.6);font-weight:500">DRIBBLING</div>
              <div style="font-size:20px;color:#FFD54F;font-weight:700;letter-spacing:-1px">90</div>
            </div>
          </div>
        </div>

        <!-- Screen 3 -->
        <div style="position:absolute;inset:0;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.5s ease;transform:translateX({{ slide3X }});opacity:{{ slide3Op }}">
          <div style="width:100%;height:100%;background:linear-gradient(135deg,#1565C0 0%,#2979FF 50%,#1565C0 100%);display:flex;align-items:center;justify-content:center;position:relative;gap:0">
            <!-- Player side -->
            <svg viewBox="0 0 100 180" style="width:80px;margin-right:-10px">
              <circle cx="50" cy="40" r="22" fill="white" opacity="0.9"/>
              <rect x="35" y="62" width="30" height="55" rx="10" fill="white" opacity="0.85"/>
              <path d="M40 117 L35 165" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
              <path d="M60 117 L65 165" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
            </svg>
            <!-- Connection motif -->
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 8px">
              <div style="width:40px;height:2px;background:linear-gradient(90deg,white,#FFD54F);border-radius:1px"></div>
              <svg viewBox="0 0 32 32" style="width:28px"><circle cx="16" cy="16" r="14" fill="none" stroke="#FFD54F" stroke-width="1.5"/><path d="M10 16 L14 20 L22 12" stroke="#FFD54F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div style="width:40px;height:2px;background:linear-gradient(90deg,#FFD54F,white);border-radius:1px"></div>
            </div>
            <!-- Scout side -->
            <svg viewBox="0 0 100 180" style="width:80px;margin-left:-10px">
              <circle cx="50" cy="40" r="22" fill="white" opacity="0.9"/>
              <rect x="35" y="62" width="30" height="55" rx="10" fill="white" opacity="0.85"/>
              <!-- Tablet -->
              <rect x="30" y="90" width="24" height="32" rx="3" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>
              <path d="M60 117 L55 165" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
              <path d="M40 117 L45 165" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
            </svg>
          </div>
        </div>

        <!-- Rounded bottom mask -->
        <div style="position:absolute;bottom:-1px;left:0;right:0;height:30px;background:white;border-radius:24px 24px 0 0"></div>
      </div>

      <!-- Content area (35%) -->
      <div style="flex:1;padding:24px 28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:white">
        <div style="text-align:center">
          <div style="font-size:24px;font-weight:700;color:#222222;margin-bottom:8px;line-height:1.2">{{ onboardingTitle }}</div>
          <div style="font-size:14px;color:#6B7280;line-height:1.5;max-width:280px">{{ onboardingSubtext }}</div>
        </div>

        <!-- Pagination dots -->
        <div style="display:flex;gap:8px;margin:16px 0">
          <div style="width:{{ dot1W }};height:8px;border-radius:4px;background:{{ dot1Color }};transition:all 0.3s ease"></div>
          <div style="width:{{ dot2W }};height:8px;border-radius:4px;background:{{ dot2Color }};transition:all 0.3s ease"></div>
          <div style="width:{{ dot3W }};height:8px;border-radius:4px;background:{{ dot3Color }};transition:all 0.3s ease"></div>
        </div>

        <!-- Navigation -->
        <div style="width:100%;display:flex;justify-content:{{ navJustify }};align-items:center">
          <sc-if value="{{ showSkip }}" hint-placeholder-val="{{ true }}">
            <div style="font-size:14px;color:#6B7280;cursor:pointer;padding:8px 0" onClick="{{ skipOnboarding }}">Skip</div>
          </sc-if>
          <sc-if value="{{ showNextBtn }}" hint-placeholder-val="{{ true }}">
            <div onClick="{{ nextSlide }}" style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FFD54F,#FFC107);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 15px rgba(255,193,7,0.3)" style-hover="transform:scale(1.05)" style-active="transform:scale(0.95)">
              <svg viewBox="0 0 24 24" style="width:24px;height:24px" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
          </sc-if>
          <sc-if value="{{ showGetStarted }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ skipOnboarding }}" style="width:100%;height:56px;border-radius:16px;background:linear-gradient(135deg,#FFD54F,#FFC107);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:700;color:#222;box-shadow:0 4px 20px rgba(255,193,7,0.3)" style-hover="transform:scale(1.02)" style-active="transform:scale(0.98)">Get Started</div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>

  <!-- AUTH / ROLE SELECTION SCREEN -->
  <div style="position:absolute;inset:0;z-index:{{ authZ }};opacity:{{ authOpacity }};transition:opacity 0.5s ease;pointer-events:{{ authPointer }}">
    <div style="width:100%;height:100%;position:relative;overflow:hidden">
      <!-- Blurred stadium bg -->
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,#0A1628 0%,#1565C0 40%,#0D47A1 70%,#0A1628 100%)">
        <!-- Stadium texture lines -->
        <div style="position:absolute;inset:0;opacity:0.05;background:repeating-linear-gradient(0deg,transparent,transparent 20px,rgba(255,255,255,0.3) 20px,rgba(255,255,255,0.3) 21px),repeating-linear-gradient(90deg,transparent,transparent 20px,rgba(255,255,255,0.3) 20px,rgba(255,255,255,0.3) 21px)"></div>
      </div>
      <!-- Dark overlay -->
      <div style="position:absolute;inset:0;background:rgba(10,22,40,0.7);backdrop-filter:blur(20px)"></div>
      <!-- Content -->
      <div style="position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
        <!-- Glass card -->
        <div style="width:100%;max-width:340px;background:rgba(255,255,255,0.08);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:32px 24px;animation:fadeSlideUp 0.6s ease-out">
          <!-- Logo -->
          <div style="text-align:center;margin-bottom:24px">
            <div style="font-size:22px;font-weight:800;color:white;letter-spacing:3px;text-transform:uppercase">MATOBEV</div>
            <div style="width:32px;height:2px;background:#FFD54F;margin:6px auto 0"></div>
          </div>
          <!-- Headline -->
          <div style="text-align:center;font-size:20px;font-weight:600;color:white;margin-bottom:24px">Join Matobev</div>
          <!-- Role tiles -->
          <div style="display:flex;gap:12px;margin-bottom:24px">
            <div onClick="{{ selectPlayer }}" style="flex:1;border-radius:16px;border:2px solid {{ playerBorder }};background:{{ playerBg }};padding:20px 12px;text-align:center;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden" style-hover="border-color:rgba(255,213,79,0.5)">
              <svg viewBox="0 0 40 40" style="width:36px;height:36px;margin-bottom:8px"><circle cx="20" cy="12" r="6" fill="none" stroke="{{ playerIconColor }}" stroke-width="1.5"/><path d="M8 38 C8 28 32 28 32 38" fill="none" stroke="{{ playerIconColor }}" stroke-width="1.5"/><circle cx="28" cy="32" r="5" fill="none" stroke="{{ playerIconColor }}" stroke-width="1.5"/></svg>
              <div style="font-size:13px;font-weight:600;color:white">I'm a Player</div>
            </div>
            <div onClick="{{ selectScout }}" style="flex:1;border-radius:16px;border:2px solid {{ scoutBorder }};background:{{ scoutBg }};padding:20px 12px;text-align:center;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden" style-hover="border-color:rgba(255,213,79,0.5)">
              <svg viewBox="0 0 40 40" style="width:36px;height:36px;margin-bottom:8px"><circle cx="20" cy="14" r="8" fill="none" stroke="{{ scoutIconColor }}" stroke-width="1.5"/><line x1="26" y1="20" x2="34" y2="28" stroke="{{ scoutIconColor }}" stroke-width="1.5"/><rect x="6" y="30" width="16" height="4" rx="1" fill="none" stroke="{{ scoutIconColor }}" stroke-width="1.5"/></svg>
              <div style="font-size:13px;font-weight:600;color:white">I'm a Scout</div>
            </div>
          </div>
          <!-- Divider -->
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
            <div style="flex:1;height:1px;background:rgba(255,255,255,0.15)"></div>
            <div style="font-size:12px;color:rgba(255,255,255,0.4);font-weight:500">or continue with</div>
            <div style="flex:1;height:1px;background:rgba(255,255,255,0.15)"></div>
          </div>
          <!-- Social buttons -->
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
            <div style="height:48px;border-radius:14px;background:rgba(255,255,255,0.95);display:flex;align-items:center;padding:0 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08)" style-hover="background:white">
              <svg viewBox="0 0 24 24" style="width:20px;height:20px;margin-right:12px"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              <span style="font-size:14px;font-weight:500;color:#222">Continue with Google</span>
            </div>
            <div style="height:48px;border-radius:14px;background:rgba(255,255,255,0.95);display:flex;align-items:center;padding:0 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08)" style-hover="background:white">

<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot; },
  &quot;startScreen&quot;: {
    &quot;editor&quot;: &quot;enum&quot;,
    &quot;options&quot;: [&quot;splash&quot;, &quot;onboarding&quot;, &quot;auth&quot;],
    &quot;default&quot;: &quot;splash&quot;,
    &quot;tsType&quot;: &quot;string&quot;,
    &quot;section&quot;: &quot;Navigation&quot;
  },
  &quot;autoAdvanceSplash&quot;: {
    &quot;editor&quot;: &quot;boolean&quot;,
    &quot;default&quot;: true,
    &quot;tsType&quot;: &quot;boolean&quot;,
    &quot;section&quot;: &quot;Navigation&quot;
  }
}">

class Component extends DCLogic {
  state = {
    screen: 'splash', // splash | onboarding | auth
    onboardingSlide: 0,
    selectedRole: null, // 'player' | 'scout'
    scale: 1,
  };

  componentDidMount() {
    this._splashTimer = setTimeout(() => {
      this.setState({ screen: 'onboarding' });
    }, 3500);
    this._computeScale = () => {
      const sw = (window.innerWidth - 40) / 402;
      const sh = (window.innerHeight - 40) / 874;
      this.setState({ scale: Math.min(sw, sh, 1) });
    };
    this._computeScale();
    window.addEventListener('resize', this._computeScale);
  }

  componentWillUnmount() {
    clearTimeout(this._splashTimer);
    window.removeEventListener('resize', this._computeScale);
  }

  renderVals() {
    const { screen, onboardingSlide, selectedRole, scale } = this.state;
    const slides = [
      { title: 'Discover Football Talent', sub: 'Every talented player deserves to be seen' },
      { title: 'AI Analyzes Your Skills', sub: 'Advanced motion tracking rates your performance like never before' },
      { title: 'Connect With Scouts', sub: 'Get discovered by top scouts and academies worldwide' },
    ];
    const s = slides[onboardingSlide];
    const isLast = onboardingSlide === 2;

    return {
      deviceScale: scale,
      // Z-index + visibility
      splashZ: screen === 'splash' ? 30 : 0,
      splashOpacity: screen === 'splash' ? 1 : 0,
      splashPointer: screen === 'splash' ? 'auto' : 'none',
      onboardingZ: screen === 'onboarding' ? 20 : 0,
      onboardingOpacity: screen === 'onboarding' ? 1 : 0,
      onboardingPointer: screen === 'onboarding' ? 'auto' : 'none',
      authZ: screen === 'auth' ? 10 : 0,
      authOpacity: screen === 'auth' ? 1 : 0,
      authPointer: screen === 'auth' ? 'auto' : 'none',

      // Slide positions
      slide1X: onboardingSlide === 0 ? '0%' : '-100%',
      slide1Op: onboardingSlide === 0 ? 1 : 0,
      slide2X: onboardingSlide === 1 ? '0%' : onboardingSlide < 1 ? '100%' : '-100%',
      slide2Op: onboardingSlide === 1 ? 1 : 0,
      slide3X: onboardingSlide === 2 ? '0%' : '100%',
      slide3Op: onboardingSlide === 2 ? 1 : 0,

      // Onboarding content
      onboardingTitle: s.title,
      onboardingSubtext: s.sub,

      // Dots
      dot1Color: onboardingSlide === 0 ? '#FFD54F' : '#E0E0E0',
      dot1W: onboardingSlide === 0 ? '24px' : '8px',
      dot2Color: onboardingSlide === 1 ? '#FFD54F' : '#E0E0E0',
      dot2W: onboardingSlide === 1 ? '24px' : '8px',
      dot3Color: onboardingSlide === 2 ? '#FFD54F' : '#E0E0E0',
      dot3W: onboardingSlide === 2 ? '24px' : '8px',

      // Nav
      showSkip: !isLast,
      showNextBtn: !isLast,
      showGetStarted: isLast,
      navJustify: isLast ? 'center' : 'space-between',

      nextSlide: () => {
        if (onboardingSlide < 2) {
          this.setState({ onboardingSlide: onboardingSlide + 1 });
        }
      },
      skipOnboarding: () => {
        this.setState({ screen: 'auth' });
      },

      // Auth role selection
      playerBorder: selectedRole === 'player' ? '#FFD54F' : 'rgba(255,255,255,0.15)',
      playerBg: selectedRole === 'player' ? 'rgba(255,213,79,0.1)' : 'rgba(255,255,255,0.05)',
      playerIconColor: selectedRole === 'player' ? '#FFD54F' : 'rgba(255,255,255,0.7)',
      scoutBorder: selectedRole === 'scout' ? '#FFD54F' : 'rgba(255,255,255,0.15)',
      scoutBg: selectedRole === 'scout' ? 'rgba(255,213,79,0.1)' : 'rgba(255,255,255,0.05)',
      scoutIconColor: selectedRole === 'scout' ? '#FFD54F' : 'rgba(255,255,255,0.7)',
      selectPlayer: () => this.setState({ selectedRole: 'player' }),
      selectScout: () => this.setState({ selectedRole: 'scout' }),
    };
  }
}

</script>
</body>
