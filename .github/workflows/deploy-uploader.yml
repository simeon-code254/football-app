name: Deploy uploader

on:
  push:
    branches: [main]
    paths:
      - "uploader/**"
      - ".github/workflows/deploy-uploader.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # shared with update-clip-count.yml. Not cancel-in-progress: killing a
  # half-finished Pages deploy to start another leaves the site on the old
  # build, which is the failure this whole change exists to stop.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site root
        run: |
          mkdir -p _site
          cp uploader/index.html _site/index.html
          # the shared clip tally; the page fetches it at load and falls back
          # to its built-in number if it is missing
          cp uploader/count.json _site/count.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4