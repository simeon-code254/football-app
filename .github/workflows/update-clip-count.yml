name: Update clip count

# Counts what is actually in the container and records it in
# uploader/count.json. Nothing renders this any more -- the page dropped its
# counter -- so this is a reporting tool, not part of the site build.

on:
  # Manual only. The page no longer displays a count, so there is nothing to
  # keep fresh -- and the schedule was not reliably firing regardless. Run this
  # from the Actions tab when you want to know how much footage has come in.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clip-count
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Count clips in the container
        env:
          AZ_ACCOUNT: ${{ secrets.AZ_ACCOUNT }}
          AZ_CONTAINER: ${{ secrets.AZ_CONTAINER }}
          AZ_LIST_SAS: ${{ secrets.AZ_LIST_SAS }}
        run: node scripts/count-uploaded-clips.mjs

      - name: Commit if the number moved
        run: |
          if git diff --quiet -- uploader/count.json; then
            echo "count unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploader/count.json
          git commit -m "Update clip count"
          git push

